<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel 3D</title>
    <style>
        body{
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .scene {
            margin: 80px auto;
            width: 210px;
            aspect-ratio: 4 / 5;
            position: relative;
            perspective: 1000px;
        }
        .carousel{
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 10s infinite linear;
        }
        .carousel img {
            position: absolute;
            left: 0;
            top: 0;
            width: 190px;
            border-radius: 10px;
            aspect-ratio: 5 / 4;
            transform: rotatex(var(--i)) translateZ(288px);
        }
        @keyframes rotate {
            0%{ transform: rotateX(360deg);}
            100%{ transform: rotateX(0deg);}

        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="carousel">
            <img src="1.jpg" style="--i: 000deg">
            <img src="2.jpg" style="--i: 040deg">
            <img src="3.jpg" style="--i: 080deg">
            <img src="4.webp" style="--i: 120deg">
            <img src="5.jpg" style="--i: 160deg">
            <img src="6.webp" style="--i: 200deg">
            <img src="7.webp" style="--i: 240deg">
            <img src="8.jpeg" style="--i: 280deg">
            <img src="9.jpg" style="--i: 3200deg">
        </div>
    </div>
    
</body>
</html>
